# Validate integration with hassfest and HACS.
#
# Brand images ship in custom_components/easywave/brand/ (HA 2026.3+);
# home-assistant/brands is not required for this custom integration.
#
# Docs:
#   https://developers.home-assistant.io/blog/2020/04/16/hassfest/
#   https://developers.home-assistant.io/blog/2026/02/24/brands-proxy-api/
#   https://www.hacs.xyz/docs/publish/action/

name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Do not ignore checks — required for hacs/default inclusion.
          # ignore: ""

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Run Easywave unit tests
        run: python -m pytest tests/easywave -q --tb=short
