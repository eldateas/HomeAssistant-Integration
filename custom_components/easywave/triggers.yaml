        domain: sensor
        device_class: enum

gateway_connected:
  target:
    primary_entities_only: false
    entity:
      - integration: easywave
        domain: sensor
        device_class: enum

gateway_disconnected:
  target:
    primary_entities_only: false
    entity:
      - integration: easywave
        domain: sensor
        device_class: enum
