# Native Device Actions (einfach zu verwenden)
device_remove:
  name: "🗑️ Gerät entfernen"
  description: Entfernt ein ELDAT-Gerät vollständig aus Home Assistant
  target:
    device:
      integration: eldat_plugin
  fields:
    device_id:
      name: Device ID
      description: Die Home Assistant Device ID des zu entfernenden Geräts
      required: true
      selector:
        device:
          integration: eldat_plugin
    force:
      name: Erzwungene Entfernung
      description: Gerät auch entfernen, wenn es nicht manuell hinzugefügt wurde
      default: false
      selector:
        boolean:
    blacklist:
      name: Auf Blacklist setzen
      description: Gerät nach Entfernung auf Blacklist setzen
      default: true
      selector:
        boolean:

device_recreate:
  name: "🔄 Gerät neu erstellen"
  description: Entfernt und erstellt das Gerät neu (bei Problemen)
  target:
    device:
      integration: eldat_plugin
  fields:
    device_id:
      name: Device ID
      description: Die Home Assistant Device ID des neu zu erstellenden Geräts
      required: true
      selector:
        device:
          integration: eldat_plugin

device_disable:
  name: "⏸️ Gerät deaktivieren"
  description: Deaktiviert alle Entitäten dieses Geräts
  target:
    device:
      integration: eldat_plugin
  fields:
    device_id:
      name: Device ID
      description: Die Home Assistant Device ID des zu deaktivierenden Geräts
      required: true
      selector:
        device:
          integration: eldat_plugin

device_enable:
  name: "▶️ Gerät aktivieren"
  description: Aktiviert alle deaktivierten Entitäten dieses Geräts
  target:
    device:
      integration: eldat_plugin
  fields:
    device_id:
      name: Device ID
      description: Die Home Assistant Device ID des zu aktivierenden Geräts
      required: true
      selector:
        device:
          integration: eldat_plugin

cleanup_ghost_devices:
  name: "🧹 Geistergeräte bereinigen"
  description: Sucht und meldet nicht mehr verwendete oder inaktive Geräte (Geistergeräte)

cleanup_orphaned_entities:
  name: "🗑️ Verwaiste Entitäten entfernen"
  description: Entfernt alle verwaisten Entitäten von bereits gelöschten Geräten aus Home Assistant

update_translations:
  name: "🌐 Übersetzungen aktualisieren"
  description: Aktualisiert die Gerätenamen und Modellbeschreibungen basierend auf der aktuellen Sprache. Rufen Sie diesen Service auf, nachdem Sie die Sprache in den Home Assistant Einstellungen geändert haben.