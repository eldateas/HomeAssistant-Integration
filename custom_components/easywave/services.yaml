# Services for ELDAT integration

add_device:
  name: Add Device
  description: Manually add a device to the ELDAT integration
  fields:
    serial_number:
      name: Serial Number
      description: 16-byte serial number of the device (hex string)
      required: true
      example: "1234567890ABCDEF"
      selector:
        text:
    device_type:
      name: Device Type
      description: Type of the device
      required: true
      selector:
        select:
          options:
            - ew_transmitter
            - ew_receiver
            - ew_sensor
            - ewneo_transceiver
            - ewbidi_transceiver
    device_name:
      name: Device Name
      description: Friendly name for the device
      required: false
      example: "Living Room Switch"
      selector:
        text:

remove_device:
  name: Remove Device
  description: Remove a manually added device from the integration
  fields:
    serial_number:
      name: Serial Number
      description: Serial number of the device to remove
      required: true
      example: "1234567890ABCDEF"
      selector:
        text:
    force:
      name: Force Removal
      description: Force removal even if device was auto-discovered
      required: false
      default: false
      selector:
        boolean:

refresh_entity_specs:
  name: Refresh Entity Specs
  description: Regenerate entity specifications for a device (updates icons, features, etc). Reload integration after running.
  fields:
    serial_number:
      name: Serial Number
      description: Serial number of the device to refresh
      required: true
      example: "1234567890ABCDEF"
      selector:
        text:

remove_device_by_id:
  name: Remove Device (by ID)
  description: Remove a device from the device menu using Device ID
  target:
    device:
      integration: eldat_plugin
  fields:
    device_id:
      name: Device ID
      description: Home Assistant Device ID of the device to remove
      required: true
      selector:
        text:
    force:
      name: Force Removal
      description: Force removal even if device was not added manually
      required: false
      default: false
      selector:
        boolean:

list_removable_devices:
  name: List Removable Devices
  description: Get a list of all devices that can be removed
  fields: {}

bulk_remove_devices:
  name: Bulk Remove Devices  
  description: Remove multiple devices at once
  fields:
    serial_numbers:
      name: Serial Numbers
      description: List of device serial numbers to remove
      required: true
      selector:
        object:
    force:
      name: Force Removal
      description: Force removal even if devices were auto-discovered
      required: false
      default: false
      selector:
        boolean:

learn_device:
  name: Learn Device
  description: Learn a new device by listening for its telegram
  fields:
    device_type:
      name: Device Type
      description: Expected type of device to learn
      required: true
      selector:
        select:
          options:
            - ew_transmitter
            - ew_receiver
            - ew_sensor
            - ewneo_transceiver
    timeout:
      name: Timeout
      description: How long to wait for device telegram (seconds)
      required: false
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: seconds

enable_learning_mode:
  name: Enable Learning Mode
  description: Enable continuous learning mode to automatically add new devices
  fields:
    duration:
      name: Duration
      description: How long to keep learning mode enabled (seconds)
      required: false
      default: 60
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: seconds

disable_learning_mode:
  name: Disable Learning Mode
  description: Disable continuous learning mode

scan_devices:
  name: Scan for Devices
  description: Scan for new devices on the USB interface

send_command:
  name: Send Command
  description: Send a command to a specific device
  fields:
    serial_number:
      name: Serial Number
      description: Serial number of the target device
      required: true
      example: "1234567890ABCDEF"
      selector:
        text:
    command:
      name: Command
      description: Command to send (hex string)
      required: true
      example: "01"
      selector:
        text:
    button:
      name: Button
      description: Button number (0-3 for A-D)
      required: false
      selector:
        number:
          min: 0
          max: 3

export_devices:
  name: Export Devices
  description: Export device configuration to a file
  fields:
    export_path:
      name: Export Path
      description: Path where to save the export file
      required: true
      example: "/config/eldat_devices_export.json"
      selector:
        text:
    include_backup:
      name: Include Backup
      description: Create a backup before exporting
      required: false
      default: true
      selector:
        boolean:

import_devices:
  name: Import Devices
  description: Import device configuration from a file
  fields:
    import_path:
      name: Import Path
      description: Path to the import file
      required: true
      example: "/config/eldat_devices_import.json"
      selector:
        text:
    merge:
      name: Merge
      description: Merge with existing devices (true) or replace all (false)
      required: false
      default: true
      selector:
        boolean:
    backup_before_import:
      name: Backup Before Import
      description: Create a backup before importing
      required: false
      default: true
      selector:
        boolean:

backup_devices:
  name: Backup Devices
  description: Create a manual backup of device configuration
  fields:
    backup_name:
      name: Backup Name
      description: Optional name for the backup
      required: false
      example: "manual_backup"
      selector:
        text:

