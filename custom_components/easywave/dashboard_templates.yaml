# EASYWAVE Integration - Native Dashboard Templates
# Diese Vorlagen können direkt in Lovelace Dashboards verwendet werden

# ================================
# 1. GERÄTE-MANAGEMENT MIT BUTTONS (EMPFOHLEN)
# ================================
# Die einfachste Lösung - jedes Gerät hat automatisch einen "Entfernen"-Button

type: vertical-stack
title: "🏠 EASYWAVE Geräte mit Entfernen-Buttons"
cards:
  # Automatische Button-Liste
  - type: auto-entities
    filter:
      include:
        - entity_id: "button.*_entfernen"
          options:
            type: button
            tap_action:
              action: toggle
              confirmation:
                text: "Gerät wirklich entfernen?"
            icon: mdi:delete
    card:
      type: entities
      title: "🗑️ Geräte entfernen (Ein-Klick-Lösung)"
      show_header_toggle: false
    
  # Geräte-Übersicht
  - type: entities
    title: "📊 EASYWAVE Geräte-Übersicht"
    show_header_toggle: false
    entities:
      - type: custom:template-entity-row
        name: "Anzahl EASYWAVE-Geräte"
        state: "{{ device_entities(integration='easywave_plugin') | list | length }}"
        icon: mdi:counter

  # Schnelle Aktionen
  - type: horizontal-stack
    title: "⚡ Schnelle Aktionen"
    cards:
      - type: button
        name: "Alle Geräte scannen"
        icon: mdi:radar
        tap_action:
          action: call-service
          service: easywave_plugin.scan_devices
        hold_action:
          action: more-info
      - type: button
        name: "Alle entfernen"
        icon: mdi:delete-sweep
        tap_action:
          action: call-service
          service: easywave_plugin.remove_all_devices
          service_data:
            force: false
          confirmation:
            text: "Wirklich alle EASYWAVE-Geräte entfernen?"

  # Device-Aktionen (funktioniert automatisch mit allen EASYWAVE-Geräten)
  - type: entities
    title: "🔧 Geräte-Aktionen"
    show_header_toggle: false
    entities:
      - type: divider
        style: |
          hr {
            border-color: var(--primary-color);
          }
      - type: custom:hui-element
        card_type: markdown
        content: |
          **Verfügbare Aktionen für jedes EASYWAVE-Gerät:**
          
          🗑️ **Entfernen**: `easywave_plugin.device_remove`
          🔄 **Neu erstellen**: `easywave_plugin.device_recreate`
          
          *Diese Services sind direkt in der Developer Tools > Services verfügbar.*

# ================================
# 2. GERÄTE-LISTE MIT AKTIONEN
# ================================
# Erweiterte Karte mit individuellen Geräte-Aktionen:

type: entities
title: "📱 EASYWAVE Geräte mit Aktionen"
show_header_toggle: false
entities:
  # Dynamische Liste aller EASYWAVE-Geräte
  - type: custom:auto-entities
    filter:
      include:
        - integration: easywave_plugin
          options:
            type: custom:button-entity-row
            action: call-service
            service: easywave_plugin.device_remove
            service_data:
              device_id: this.entity_id
              force: false
            confirmation: "Gerät {{this.attributes.friendly_name}} entfernen?"
    card:
      type: entities
      title: "Geräte-Liste"

# ================================
# 3. EINFACHE SERVICE-AUFRUFE
# ================================
# Für manuelle Service-Aufrufe in Developer Tools:

# Gerät entfernen:
service: easywave_plugin.device_remove
target:
  device_id: "DEVICE_ID_HIER_EINFÜGEN"
data:
  force: false

# Gerät neu erstellen:
service: easywave_plugin.device_recreate
target:
  device_id: "DEVICE_ID_HIER_EINFÜGEN"


# ================================
# 4. AUTOMATIONS-BEISPIELE
# ================================
# Kopieren Sie diese in automations.yaml:

# Benachrichtigung bei Gerätentfernung
- id: easywave_device_removed_notification
  alias: "EASYWAVE Gerät entfernt - Benachrichtigung"
  trigger:
    - platform: event
      event_type: easywave_device_removed
  action:
    - service: persistent_notification.create
      data:
        title: "EASYWAVE Gerät entfernt"
        message: >
          Das EASYWAVE-Gerät "{{ trigger.event.data.get('device_name', 'Unbekannt') }}" 
          wurde erfolgreich entfernt.
        notification_id: "easywave_device_removed_{{ trigger.event.data.device_id }}"

# Automatische Reaktivierung nach Recreation
- id: easywave_device_recreated_notification
  alias: "EASYWAVE Gerät neu erstellt - Benachrichtigung"
  trigger:
    - platform: event
      event_type: easywave_device_recreated
  action:
    - service: persistent_notification.create
      data:
        title: "EASYWAVE Gerät neu erstellt"
        message: >
          Das EASYWAVE-Gerät "{{ trigger.event.data.get('device_name', 'Unbekannt') }}" 
          wurde erfolgreich neu erstellt und ist wieder verfügbar.
        notification_id: "easywave_device_recreated_{{ trigger.event.data.device_id }}"

# ================================
# 5. SCRIPT-VORLAGEN
# ================================
# Kopieren Sie diese in scripts.yaml:

easywave_emergency_cleanup:
  alias: "🚨 EASYWAVE Notfall-Bereinigung"
  icon: mdi:broom
  sequence:
    - service: easywave_plugin.remove_all_devices
      data:
        force: true
    - service: easywave_plugin.scan_devices
    - delay: 
        seconds: 5
    - service: persistent_notification.create
      data:
        title: "EASYWAVE Bereinigung abgeschlossen"
        message: "Alle EASYWAVE-Geräte wurden entfernt und ein neuer Scan gestartet."

easywave_device_health_check:
  alias: "🔍 EASYWAVE Geräte-Gesundheitscheck"
  icon: mdi:heart-pulse
  sequence:
    - service: easywave_plugin.scan_devices
    - delay:
        seconds: 10
    - service: persistent_notification.create
      data:
        title: "EASYWAVE Gesundheitscheck"
        message: >
          Gesundheitscheck abgeschlossen. 
          Aktuelle Geräteanzahl: {{ device_entities(integration='easywave_plugin') | list | length }}

# ================================
# INSTALLATION UND VERWENDUNG
# ================================

# 1. Integration installieren (Custom Repository oder HACS)
# 2. EASYWAVE Integration hinzufügen (Konfiguration > Integrationen)
# 3. USB-Gerät auswählen und konfigurieren
# 4. Diese Dashboard-Vorlagen kopieren und verwenden
# 5. Fertig! Keine weiteren Plugins oder Konfigurationen nötig

# WICHTIG: Alle Services sind sofort nach der Integration verfügbar
# und benötigen keine zusätzliche Konfiguration oder Installation.