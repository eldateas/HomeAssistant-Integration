# ELDAT Device Management Automation Templates
# Diese Datei enthält vorgefertigte Automations für die Geräte-Verwaltung

# Automation 1: Benachrichtigung bei erfolgreichem Entfernen
eldat_device_removal_notification:
  alias: "ELDAT: Device Removal Notification"
  description: "Zeigt Benachrichtigung wenn ein ELDAT Gerät entfernt wurde"
  trigger:
    - platform: event
      event_type: eldat_device_removal_success
  action:
    - service: persistent_notification.create
      data:
        title: "ELDAT Gerät entfernt"
        message: >
          Gerät "{{ trigger.event.data.device_name }}" 
          ({{ trigger.event.data.device_type }}) 
          wurde erfolgreich entfernt.
          {% if trigger.event.data.was_manual %}
          ✅ Manuell hinzugefügtes Gerät
          {% else %}
          🔍 Auto-erkanntes Gerät
          {% endif %}
        notification_id: "eldat_device_removed"
    - service: system_log.write
      data:
        message: >
          ELDAT Device removed via {{ trigger.event.data.removal_method }}: 
          {{ trigger.event.data.device_name }} ({{ trigger.event.data.serial_number }})
        level: info

# Automation 2: Warnung bei Entfernungsfehlern  
eldat_device_removal_error:
  alias: "ELDAT: Device Removal Error"
  description: "Warnt bei Fehlern beim Entfernen von ELDAT Geräten"
  trigger:
    - platform: event
      event_type: eldat_device_removal_error
  action:
    - service: persistent_notification.create
      data:
        title: "ELDAT Gerät Entfernung Fehler"
        message: >
          ❌ Fehler beim Entfernen von Gerät "{{ trigger.event.data.get('device_name', 'Unbekannt') }}"
          
          Serial: {{ trigger.event.data.serial_number }}
          Fehler: {{ trigger.event.data.error }}
          Methode: {{ trigger.event.data.removal_method }}
          
          Versuche es erneut mit force=true oder über die Services.
        notification_id: "eldat_device_error"
    - service: system_log.write
      data:
        message: >
          ELDAT Device removal failed: {{ trigger.event.data.error }} 
          ({{ trigger.event.data.serial_number }})
        level: error

# Automation 3: Wöchentliche Aufräum-Erinnerung
eldat_weekly_cleanup_reminder:
  alias: "ELDAT: Weekly Cleanup Reminder"
  description: "Wöchentliche Erinnerung für ELDAT Geräte-Aufräumen"
  trigger:
    - platform: time
      at: "10:00:00"
    - platform: time_pattern
      weekday: 1  # Montag
  condition:
    - condition: time
      weekday:
        - mon
  action:
    - service: eldat.list_removable_devices
    - delay: "00:00:02"
    - service: persistent_notification.create
      data:
        title: "ELDAT Geräte-Aufräumen"
        message: >
          🧹 Zeit für das wöchentliche Aufräumen!
          
          Prüfe deine ELDAT Geräte auf:
          - Nicht mehr benötigte Geräte
          - Auto-erkannte Test-Geräte  
          - Doppelte Einträge
          
          Nutze die Services oder Remove-Buttons für die Bereinigung.
        notification_id: "eldat_cleanup_reminder"

# Script 1: Sicheres Entfernen mit Bestätigung
eldat_safe_device_removal:
  alias: "ELDAT: Safe Device Removal"
  description: "Sicher ein Gerät entfernen mit Bestätigung"
  fields:
    device_serial:
      description: "Serial number of device to remove"
      required: true
  sequence:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.eldat_removal_confirmation
    - service: persistent_notification.create
      data:
        title: "ELDAT Gerät Entfernung bestätigen"
        message: >
          Möchtest du das Gerät {{ device_serial }} wirklich entfernen?
          
          Klicke auf 'Bestätigen' um fortzufahren oder 'Abbrechen' um abzubrechen.
        notification_id: "eldat_confirm_removal"
    - wait_for_trigger:
        - platform: state
          entity_id: input_boolean.eldat_removal_confirmed
          to: "on"
        - platform: state  
          entity_id: input_boolean.eldat_removal_cancelled
          to: "on"
      timeout: "00:05:00"
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.eldat_removal_confirmed
              state: "on"
          sequence:
            - service: eldat.remove_device
              data:
                serial_number: "{{ device_serial }}"
                force: true
            - service: persistent_notification.dismiss
              data:
                notification_id: "eldat_confirm_removal"
        - conditions:
            - condition: state
              entity_id: input_boolean.eldat_removal_cancelled  
              state: "on"
          sequence:
            - service: persistent_notification.create
              data:
                title: "ELDAT Entfernung abgebrochen"
                message: "Die Entfernung von {{ device_serial }} wurde abgebrochen."
                notification_id: "eldat_removal_cancelled"
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.eldat_removal_confirmation
          - input_boolean.eldat_removal_confirmed
          - input_boolean.eldat_removal_cancelled

# Script 2: Bulk-Entfernung aller Test-Geräte
eldat_remove_test_devices:
  alias: "ELDAT: Remove Test Devices"
  description: "Entferne alle Geräte die als Test erkannt werden"
  sequence:
    - service: eldat.list_removable_devices
    - delay: "00:00:01"
    - repeat:
        for_each: >
          {{ states | selectattr('entity_id', 'search', 'eldat') 
             | selectattr('attributes.added_manually', 'eq', false)
             | selectattr('attributes.name', 'search', 'test|temp|unknown')
             | map(attribute='attributes.serial_number') | list }}
        sequence:
          - service: eldat.remove_device
            data:
              serial_number: "{{ repeat.item }}"
              force: true
          - delay: "00:00:01"

